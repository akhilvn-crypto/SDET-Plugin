# Mobile test configuration. Precedence: -Dkey=value on the mvn command line > environment variable
# (upper-case, dots -> underscores, e.g. APP_PACKAGE) > this file.
# NEVER put credentials here - tests read them from environment variables via Config.secret("NAME").

appium.url={{APPIUM_URL}}
platform.name=Android
automation.name=UiAutomator2
device.udid={{UDID}}
app.package={{APP_PACKAGE}}
app.activity={{APP_ACTIVITY}}
# Optional: path to an .apk to install before the run (leave blank to test the installed app).
app.path=
# true = keep app data between tests (faster); false = clear app data before each test.
no.reset=true
explicit.wait.seconds=15
# Record the screen for each test and keep the video only when the test fails.
record.video=true
